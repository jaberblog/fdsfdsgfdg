name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android lint (lintVital*) crashes on some plugins (JDK API mismatch) and is
      # not needed to produce an APK, so it is disabled for every Gradle project.
      - name: Disable lintVital tasks
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/no-lint.gradle <<'GRADLE'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lintVital') || t.name == 'lint') { t.enabled = false }
            }
          }
          GRADLE

      # The repo only contains lib/, assets/, pubspec.yaml and tool/.
      # The Android scaffold is generated here, then patched for flutter_vless.
      - name: Generate Android scaffold
        run: |
          mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create --org ir.virasub --project-name vless_vpn --platforms=android .
          rm -rf lib && cp -r /tmp/keep/lib lib      # make sure our sources win
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          rm -rf test
          python3 tool/patch_android.py

      - name: Dependencies
        run: flutter pub get

      - name: Build APK (universal)
        run: flutter build apk --release --no-shrink || flutter build apk --release

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi --no-shrink || flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: vira-vpn-apk
          path: build/app/outputs/flutter-apk/*.apk
